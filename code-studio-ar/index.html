<!doctype html><meta charset=utf-8><title>ستوديو الكود</title><body style="background:#10141c;color:#fff;font-family:sans-serif;text-align:center;padding:40px">جاري التحميل...<script>(async()=>{const h=location.hash;let best=0;await Promise.all(Array.from({length:60},(_,i)=>i+1).map(async n=>{try{const r=await fetch(n+"-index.html",{method:"HEAD"});if(r.ok&&n>best)best=n}catch(e){}}));if(best)location.replace(best+"-index.html"+h);else document.body.textContent="مش لاقي النسخة"})()</script>
