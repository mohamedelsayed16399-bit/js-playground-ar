<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf-8><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ستوديو الكود</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#10141c"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"></head><body style="background:#10141c;color:#fff;font-family:sans-serif;text-align:center;padding:40px">جاري التحميل...<script>(async()=>{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});const h=location.hash;let best=0;try{await Promise.all(Array.from({length:80},(_,i)=>i+1).map(async n=>{try{const r=await fetch(n+"-index.html",{method:"HEAD"});if(r.ok&&n>best)best=n}catch(e){}}))}catch(e){}if(best)localStorage.csBest=best;else best=+localStorage.csBest||0;if(best)location.replace(best+"-index.html"+h);else document.body.textContent="مش لاقي النسخة. اتأكد من النت وافتح مرة تانية."})()</script></body></html>
