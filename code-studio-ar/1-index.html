<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ستوديو الكود</title>
<style>:root{--bg:#10141c;--p:#171d29;--b:#263042;--t:#e6ebf5;--m:#8a97ad;--a:#4f9dff}
body.light{--bg:#f3f5f9;--p:#fff;--b:#d5dbe6;--t:#1b2433;--m:#5d6a80;--a:#1e6fe0}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:14px system-ui,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--p);border-bottom:1px solid var(--b);flex-wrap:wrap}
.logo{margin-inline-end:auto}
button,select{background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
button.primary{background:var(--a);color:#fff;border-color:var(--a)}
nav{display:flex;overflow-x:auto;background:var(--p);border-bottom:1px solid var(--b)}
nav button{border:0;border-radius:0;background:none;color:var(--m);padding:8px 14px;direction:ltr;white-space:nowrap}
nav button.on{color:var(--t);border-bottom:2px solid var(--a)}
main{flex:1;display:flex;min-height:0}
section{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#editorPane{border-inline-start:1px solid var(--b)}
.bar{display:flex;gap:6px;align-items:center;padding:4px 8px;background:var(--p);border-bottom:1px solid var(--b);color:var(--m);font-size:12px}
.bar span:first-child{margin-inline-end:auto}.bar button{padding:3px 8px;font-size:12px}
.ed{flex:1;display:flex;min-height:0;direction:ltr;background:var(--bg)}
#gutter{margin:0;padding:10px 6px;color:var(--m);text-align:right;font:13px/1.55 ui-monospace,Consolas,monospace;overflow:hidden;user-select:none;min-width:34px}
#code{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--t);padding:10px;font:13px/1.55 ui-monospace,Consolas,monospace;tab-size:2;white-space:pre;overflow:auto}
.frameWrap{flex:1;background:#888;display:flex;justify-content:center;min-height:0}
iframe{width:100%;height:100%;border:0;background:#fff}
#con{height:120px;overflow:auto;background:var(--bg);font:12px ui-monospace,monospace;direction:ltr;padding:4px 8px}
#con div{border-bottom:1px solid var(--b);padding:2px 0;white-space:pre-wrap}
#con .error{color:#ff6b6b}#con .warn{color:#e8b64a}
#modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9}
#modal[hidden],#toast[hidden]{display:none}
.box{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:16px;max-width:92vw;width:420px;max-height:80vh;overflow:auto}
.box h3{margin:0 0 10px}.box .row{display:flex;gap:8px;margin-top:10px;justify-content:flex-start}
.box input{width:100%;padding:8px;border-radius:8px;border:1px solid var(--b);background:var(--bg);color:var(--t);font:inherit}
.tpl{display:block;width:100%;text-align:start;margin-bottom:6px}.tpl small{display:block;color:var(--m)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--a);color:#fff;padding:8px 16px;border-radius:20px;z-index:10}
@media(max-width:760px){main{flex-direction:column}#editorPane{border:0;border-bottom:1px solid var(--b)}#con{height:70px}}

.cw{position:relative;flex:1;min-width:0}
#hl,#code{position:absolute;inset:0;margin:0;padding:10px;font:13px/1.55 ui-monospace,Consolas,monospace;tab-size:2;white-space:pre;overflow:hidden;border:0;letter-spacing:0}
#code{background:transparent;color:transparent;caret-color:var(--t);overflow:auto}
#code::selection{background:#4f9dff55;color:transparent}
#hl{color:var(--t);pointer-events:none}
.k{color:#c678dd}.s{color:#98c379}.n{color:#d19a66}.c{color:#7f8aa0;font-style:italic}.t{color:#e06c75}.a{color:#d19a66}
body.light .k{color:#8a2be2}body.light .s{color:#2a7d2e}body.light .n{color:#b25a00}body.light .t{color:#c0392b}
#repl{border:0;border-top:1px solid var(--b);background:var(--p);color:var(--t);padding:6px 8px;font:12px ui-monospace,monospace}
mark{background:#e8b64a88;color:inherit}
</style>
</head>
<body>
<header>
  <b class="logo">🧑‍💻 ستوديو الكود</b>
  <select id="projSel" title="المشاريع"></select>
  <button id="newBtn">+ جديد</button>
  <button id="tplBtn">قوالب</button><button id="libBtn">📦 مكتبات</button><button id="histBtn">🕘 نسخ</button>
  <button id="runBtn" class="primary">▶ شغّل</button>
  <button id="shareBtn">🔗 مشاركة</button>
  <button id="zipBtn">⬇ ZIP</button>
  <button id="themeBtn">🌓</button>
</header>
<nav id="tabs"></nav>
<main>
  <section id="editorPane">
    <div class="bar"><span id="fname"></span><span id="pos"></span>
      <button id="addFile">+ ملف</button><button id="delFile">حذف</button><button id="renFile">إعادة تسمية</button><button id="fmtBtn">تنسيق</button><button id="findBtn">🔍</button><button id="impBtn">استيراد</button><input type="file" id="impIn" multiple hidden>
    </div>
    <div class="ed"><pre id="gutter"></pre><div class="cw"><pre id="hl" aria-hidden="true"></pre><textarea id="code" spellcheck="false" autocapitalize="off" dir="ltr"></textarea></div></div>
  </section>
  <section id="previewPane">
    <div class="bar"><span>المعاينة</span>
      <select id="devSel"><option value="100%">كامل</option><option value="375px">موبايل</option><option value="768px">تابلت</option></select>
      <label><input type="checkbox" id="auto" checked> تلقائي</label></div>
    <div class="frameWrap"><iframe id="frame" sandbox="allow-scripts allow-modals allow-forms"></iframe></div>
    <div class="bar"><span>الكونسول</span><button id="clrCon">مسح</button></div>
    <div id="con"></div>
    <input id="repl" dir="ltr" placeholder="> اكتب JS ونفذه في المعاينة (Enter)">
  </section>
</main>
<div id="modal" hidden><div class="box" id="modalBox"></div></div>
<div id="toast" hidden></div>
<script>const TEMPLATES=[

'game.js':'const x=c.getContext("2d"),S=15;let s=[{x:5,y:5}],d={x:1,y:0},f={x:10,y:10},sc=0;\nonkeydown=e=>{const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(k&&(k[0]!=-d.x||k[1]!=-d.y))d={x:k[0],y:k[1]}};\nlet t0;c.ontouchstart=e=>t0=e.touches[0];c.ontouchend=e=>{const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;d=Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)}};\nsetInterval(()=>{const h={x:(s[0].x+d.x+20)%20,y:(s[0].y+d.y+20)%20};if(s.some(p=>p.x==h.x&&p.y==h.y)){s=[{x:5,y:5}];sc=0}s.unshift(h);if(h.x==f.x&&h.y==f.y){sc++;f={x:Math.random()*20|0,y:Math.random()*20|0}}else s.pop();x.fillStyle="#021";x.fillRect(0,0,300,300);x.fillStyle="red";x.fillRect(f.x*S,f.y*S,S-1,S-1);x.fillStyle="#4f4";s.forEach(p=>x.fillRect(p.x*S,p.y*S,S-1,S-1));x.fillStyle="#fff";x.fillText("النتيجة "+sc,6,12)},110)'}},
{name:'قائمة مهام',desc:'To-do بحفظ محلي',files:{
'index.html':'<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body><h2>مهامي</h2><form id="f"><input id="i" placeholder="مهمة جديدة" required><button>إضافة</button></form><ul id="l"></ul><script src="app.js"><\/script></body></html>',
'style.css':'body{font-family:sans-serif;max-width:420px;margin:20px auto;padding:0 12px}li{padding:8px;border-bottom:1px solid #ddd;cursor:pointer}li.d{text-decoration:line-through;opacity:.5}input{padding:8px;width:65%}',
'app.js':'let a=JSON.parse(localStorage.todo||"[]");const R=()=>{localStorage.todo=JSON.stringify(a);l.innerHTML="";a.forEach((t,k)=>{const e=document.createElement("li");e.textContent=t.t;if(t.d)e.className="d";e.onclick=()=>{t.d=!t.d;R()};e.oncontextmenu=ev=>{ev.preventDefault();a.splice(k,1);R()};l.append(e)})};f.onsubmit=e=>{e.preventDefault();a.push({t:i.value,d:0});i.value="";R()};R()'}}
,{name:'حاسبة',desc:'حاسبة بأزرار',files:{

<script>// minimal store-only ZIP writer
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=~0;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(~c)>>>0}
function makeZip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
for(const[name,txt]of Object.entries(files)){const nb=enc.encode(name),d=enc.encode(txt),c=crc32(d);
const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);
parts.push(new Uint8Array(h.buffer),nb,d);
const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint32(16,c,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,nb.length,true);e.setUint32(42,off,true);
cd.push(new Uint8Array(e.buffer),nb);off+=30+nb.length+d.length}
const cl=cd.reduce((s,x)=>s+x.length,0),end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,Object.keys(files).length,true);end.setUint16(10,Object.keys(files).length,true);end.setUint32(12,cl,true);end.setUint32(16,off,true);
return new Blob([...parts,...cd,end],{type:'application/zip'})}
</script>
<script>const $=id=>document.getElementById(id);
let DB=JSON.parse(localStorage.csDB||'null')||{cur:null,projects:{}};
let cur,file;
const save=()=>localStorage.csDB=JSON.stringify(DB);
const toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)};
function modal(html){$('modalBox').innerHTML=html;$('modal').hidden=false}
const closeModal=()=>$('modal').hidden=true;
$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function ask(title,def=''){return new Promise(r=>{modal(`<h3>${title}</h3><input id="mi" value="${def.replace(/"/g,'&quot;')}"><div class="row"><button class="primary" id="mok">تمام</button><button id="mc">إلغاء</button></div>`);const i=$('mi');i.focus();i.select();const done=v=>{closeModal();r(v)};$('mok').onclick=()=>done(i.value.trim());$('mc').onclick=()=>done(null);i.onkeydown=e=>{if(e.key==='Enter')done(i.value.trim())}})}
function newProject(name,files){const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);DB.projects[id]={name,files:{...files}};DB.cur=id;save();load()}
function load(){cur=DB.projects[DB.cur];if(!cur){newProject('مشروعي',TEMPLATES[0].files);return}
file=Object.keys(cur.files)[0];renderAll();run()}
function renderAll(){const s=$('projSel');s.innerHTML='';for(const[id,p]of Object.entries(DB.projects)){const o=document.createElement('option');o.value=id;o.textContent=p.name;s.append(o)}s.value=DB.cur;renderTabs();showFile()}
function renderTabs(){const n=$('tabs');n.innerHTML='';for(const f of Object.keys(cur.files)){const b=document.createElement('button');b.textContent=f;if(f===file)b.className='on';b.onclick=()=>{file=f;renderTabs();showFile()};n.append(b)}}
function showFile(){$('fname').textContent=file;$('code').value=cur.files[file]??'';gutter()}
function gutter(){const n=$('code').value.split('\n').length;$('gutter').textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}
function build(){const f=cur.files;let h=f['index.html']||'<body></body>';
h=h.replace(/<link[^>]+href=["']([^"']+)["'][^>]*>/gi,(m,p)=>f[p]!=null&&/stylesheet/i.test(m)?`<style>${f[p]}</style>`:m);
h=h.replace(/<script([^>]*)src=["']([^"']+)["']([^>]*)><\/script>/gi,(m,a,p,b)=>f[p]!=null?`<script${a}${b}>${f[p].replace(/<\/script/gi,'<\\/script')}<\/script>`:m);
const hook=`<script>(function(){addEventListener('message',e=>{if(e.data&&e.data.csEval!=null){try{const r=(0,eval)(e.data.csEval);console.log(r===undefined?'undefined':r)}catch(x){console.error(String(x))}}});try{localStorage.length}catch(e){const m={};const ls={getItem:k=>k in m?m[k]:null,setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]},clear:()=>{for(const k in m)delete m[k]}};try{Object.defineProperty(window,'localStorage',{value:new Proxy(ls,{get:(t,k)=>k in t?t[k]:(k in m?m[k]:undefined),set:(t,k,v)=>{m[k]=String(v);return true}})})}catch(e){}}const s=(t,a)=>parent.postMessage({cs:1,t,m:a.map(x=>{try{return typeof x==='object'?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(' ')},'*');['log','warn','error','info'].forEach(k=>{const o=console[k];console[k]=(...a)=>{s(k,a);o.apply(console,a)}});onerror=(m,u,l)=>{s('error',[m+' (سطر '+l+')'])};addEventListener('unhandledrejection',e=>s('error',['Promise: '+e.reason]))})()<\/script>`;
return /<head[^>]*>/i.test(h)?h.replace(/<head[^>]*>/i,m=>m+hook):hook+h}
function run(){$('frame').srcdoc=build()}
addEventListener('message',e=>{const d=e.data;if(d&&d.cs){const c=$('con'),x=document.createElement('div');x.className=d.t;x.textContent=d.m;c.append(x);c.scrollTop=1e9}});
$('clrCon').onclick=()=>$('con').innerHTML='';
let tm;$('code').oninput=()=>{cur.files[file]=$('code').value;save();gutter();if($('auto').checked){clearTimeout(tm);tm=setTimeout(()=>{$('con').innerHTML='';run()},500)}};
$('code').onscroll=()=>$('gutter').scrollTop=$('code').scrollTop;
$('code').onkeydown=e=>{const t=e.target;if(e.key==='Tab'){e.preventDefault();ins(t,'  ')}else if(e.key==='Enter'&&!e.isComposing){const s=t.selectionStart,ln=t.value.lastIndexOf('\n',s-1)+1,ind=t.value.slice(ln,s).match(/^\s*/)[0];const extra=/[{\[(]\s*$/.test(t.value.slice(ln,s))?'  ':'';e.preventDefault();ins(t,'\n'+ind+extra)}else if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();$('con').innerHTML='';run()}};
function ins(t,s){t.setRangeText(s,t.selectionStart,t.selectionEnd,'end');t.dispatchEvent(new Event('input'))}
$('code').onkeyup=$('code').onclick=()=>{const t=$('code'),b=t.value.slice(0,t.selectionStart).split('\n');$('pos').textContent=`سطر ${b.length}:${b[b.length-1].length+1}`};
$('runBtn').onclick=()=>{$('con').innerHTML='';run()};
$('projSel').onchange=e=>{DB.cur=e.target.value;save();load()};
$('devSel').onchange=e=>$('frame').style.width=e.target.value;
$('themeBtn').onclick=()=>{document.body.classList.toggle('light');localStorage.csTheme=document.body.classList.contains('light')?1:''};
if(localStorage.csTheme)document.body.classList.add('light');
$('newBtn').onclick=async()=>{const n=await ask('اسم المشروع الجديد','مشروع '+(Object.keys(DB.projects).length+1));if(n)newProject(n,TEMPLATES[0].files)};
$('tplBtn').onclick=()=>{modal('<h3>اختار قالب</h3>'+TEMPLATES.map((t,i)=>`<button class="tpl" data-i="${i}">${t.name}<small>${t.desc}</small></button>`).join(''));document.querySelectorAll('.tpl').forEach(b=>b.onclick=()=>{const t=TEMPLATES[+b.dataset.i];closeModal();newProject(t.name,t.files)})};
$('addFile').onclick=async()=>{const n=await ask('اسم الملف (مثال: extra.js)');if(!n)return;if(!/^[\w.\-\/]+$/.test(n)||cur.files[n]!=null)return toast('اسم غلط أو موجود');cur.files[n]='';file=n;save();renderTabs();showFile()};
$('delFile').onclick=()=>{if(Object.keys(cur.files).length<2)return toast('لازم يفضل ملف واحد');if(!confirm('حذف '+file+'؟'))return;delete cur.files[file];file=Object.keys(cur.files)[0];save();renderTabs();showFile();run()};
$('renFile').onclick=async()=>{const n=await ask('الاسم الجديد',file);if(!n||n===file)return;if(!/^[\w.\-\/]+$/.test(n)||cur.files[n]!=null)return toast('اسم غلط أو موجود');const o={};for(const k in cur.files)o[k===file?n:k]=cur.files[k];cur.files=o;file=n;save();renderTabs();showFile();run()};
function fmt(src,name){if(/\.json$/.test(name)){try{return JSON.stringify(JSON.parse(src),null,2)}catch(e){toast('JSON فيه غلط');return src}}
let lv=0;return src.split('\n').map(l=>{l=l.trim();if(/^[}\])]/.test(l))lv=Math.max(0,lv-1);const r='  '.repeat(lv)+l;const o=(l.match(/[{\[(]/g)||[]).length,c=(l.match(/[}\])]/g)||[]).length;lv=Math.max(0,lv+o-c+(/^[}\])]/.test(l)?1:0));return l?r:''}).join('\n')}
$('fmtBtn').onclick=()=>{if(/\.(js|css|json)$/.test(file)){cur.files[file]=fmt(cur.files[file],file);save();showFile();toast('اتنسق')}else toast('التنسيق لـ js/css/json')};
$('zipBtn').onclick=()=>{const b=makeZip(cur.files),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=cur.name+'.zip';a.click();toast('نزل ZIP')};
async function pack(o){const s=new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream('deflate-raw'));const b=new Uint8Array(await new Response(s).arrayBuffer());let x='';b.forEach(c=>x+=String.fromCharCode(c));return btoa(x).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function unpack(h){h=h.replace(/-/g,'+').replace(/_/g,'/');const x=atob(h),b=Uint8Array.from(x,c=>c.charCodeAt(0));const s=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(s).text())}
$('shareBtn').onclick=async()=>{const h=await pack({n:cur.name,f:cur.files});const u=location.href.split('#')[0]+'#p='+h;try{await navigator.clipboard.writeText(u);toast('اللينك اتنسخ ('+u.length+' حرف)')}catch(e){modal('<h3>انسخ اللينك</h3><input value="'+u+'" onfocus="this.select()">')}};
(async()=>{const m=location.hash.match(/^#p=(.+)/);if(m){try{const o=await unpack(m[1]);if(confirm('فتح مشروع مشارك: '+o.n+'؟')){newProject(o.n+' (مشارك)',o.f);history.replaceState(0,'',location.pathname);return}}catch(e){toast('اللينك بايظ')}}load()})();

// ---- v2: highlighting, find/replace, import, repl
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW='break|case|catch|class|const|continue|default|delete|do|else|export|extends|finally|for|function|if|import|in|instanceof|let|new|return|super|switch|this|throw|try|typeof|var|void|while|with|yield|async|await|of|null|true|false|undefined';
const JSRE=new RegExp("(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)|(\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*'|`(?:\\\\.|[^`\\\\])*`)|\\b(\\d+\\.?\\d*)\\b|\\b("+KW+")\\b|([&<>])","g");
function hlJS(s){return s.replace(JSRE,(m,c,st,n,k,x)=>c?`<i class=c>${esc(c)}</i>`:st?`<i class=s>${esc(st)}</i>`:n?`<i class=n>${n}</i>`:k?`<i class=k>${k}</i>`:esc(x))}
function hlCSS(s){return s.replace(/(\/\*[\s\S]*?\*\/)|([&<>])|(#[0-9a-fA-F]{3,8}\b|\b\d+\.?\d*(?:px|em|rem|%|vh|vw|s|ms|deg)?\b)|([\w-]+)(?=\s*:)/g,(m,c,x,n,p)=>c?`<i class=c>${esc(c)}</i>`:x?esc(x):n?`<i class=n>${n}</i>`:`<i class=k>${p}</i>`)}
function hlHTML(s){return esc(s).replace(/(&lt;!--[\s\S]*?--&gt;)|(&lt;\/?)([\w-]+)([^&]*?)(\/?&gt;)/g,(m,c,o,t,at,e)=>c?`<i class=c>${c}</i>`:`${o}<i class=t>${t}</i>${at.replace(/([\w-:]+)(=)?("[^"]*"|'[^']*')?/g,(q,nm,eq,v)=>nm?`<i class=a>${nm}</i>${eq||''}${v?`<i class=s>${v}</i>`:''}`:q)}${e}`)}
function paint(){const v=$('code').value,f=file||'';let o;if(f.endsWith('.js')||f.endsWith('.json'))o=hlJS(v);else if(f.endsWith('.css'))o=hlCSS(v);else if(f.endsWith('.html'))o=hlHTML(v);else o=esc(v);
$('hl').innerHTML=o+'\n';$('hl').scrollTop=$('code').scrollTop;$('hl').scrollLeft=$('code').scrollLeft}
const _showFile=showFile;showFile=function(){_showFile();paint()};
$('code').addEventListener('input',paint);
$('code').addEventListener('scroll',()=>{$('hl').scrollTop=$('code').scrollTop;$('hl').scrollLeft=$('code').scrollLeft});
paint();
// find / replace
$('findBtn').onclick=()=>{modal('<h3>بحث واستبدال (في الملف ده)</h3><input id="fq" placeholder="ابحث عن" dir="auto"><div style="height:8px"></div><input id="fr" placeholder="استبدل بـ" dir="auto"><div class="row"><button id="fnext">التالي</button><button id="fall" class="primary">استبدل الكل</button><label><input type="checkbox" id="frx" style="width:auto"> Regex</label></div><div id="fcnt" style="margin-top:8px;color:var(--m)"></div>');
const mk=()=>{const q=$('fq').value;if(!q)return null;try{return $('frx').checked?new RegExp(q,'g'):new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g')}catch(e){return null}};
$('fq').oninput=()=>{const r=mk();$('fcnt').textContent=r?(($('code').value.match(r)||[]).length+' نتيجة'):''};
$('fnext').onclick=()=>{const r=mk();if(!r)return;const t=$('code'),s=t.value;r.lastIndex=t.selectionEnd;let m=r.exec(s)||(r.lastIndex=0,r.exec(s));if(!m)return;closeModal();t.focus();t.setSelectionRange(m.index,m.index+m[0].length)};
$('fall').onclick=()=>{const r=mk();if(!r)return;const t=$('code'),n=(t.value.match(r)||[]).length;t.value=t.value.replace(r,$('fr').value);t.dispatchEvent(new Event('input'));closeModal();toast('اتبدل '+n)}};
// import
$('impBtn').onclick=()=>$('impIn').click();
$('impIn').onchange=async e=>{for(const f of e.target.files){if(f.size>500000){toast(f.name+' كبير');continue}cur.files[f.name]=await f.text();file=f.name}e.target.value='';save();renderTabs();showFile();run()};
// repl
const hist=[];let hi=0;
$('repl').onkeydown=e=>{const i=e.target;if(e.key==='Enter'&&i.value.trim()){hist.push(i.value);hi=hist.length;const c=$('con'),d=document.createElement('div');d.textContent='> '+i.value;d.className='warn';c.append(d);$('frame').contentWindow.postMessage({csEval:i.value},'*');i.value=''}else if(e.key==='ArrowUp'&&hi>0){i.value=hist[--hi]}else if(e.key==='ArrowDown'){i.value=hist[++hi]||'';hi=Math.min(hi,hist.length)}};

// ---- v3: libs + history
$('libBtn').onclick=()=>{modal('<h3>إضافة مكتبة (من الإنترنت)</h3>'+LIBS.map((l,i)=>`<button class="tpl" data-i="${i}">${l[0]}<small dir="ltr">${l[1]}</small></button>`).join(''));document.querySelectorAll('.tpl').forEach(b=>b.onclick=()=>{const l=LIBS[+b.dataset.i],tag=`<script src="${l[1]}"><\/script>`;let h=cur.files['index.html']||'';if(h.includes(l[1])){closeModal();return toast('موجودة')}h=/<head[^>]*>/i.test(h)?h.replace(/<head[^>]*>/i,m=>m+'\n'+tag):tag+'\n'+h;cur.files['index.html']=h;save();closeModal();if(file==='index.html')showFile();run();toast('اتضافت '+l[0])})};
const SNAP=()=>JSON.parse(localStorage.csHist||'{}');
function snap(label){const H=SNAP(),k=DB.cur;(H[k]=H[k]||[]).push({t:Date.now(),l:label,f:cur.files});H[k]=H[k].slice(-15);try{localStorage.csHist=JSON.stringify(H)}catch(e){toast('المساحة ممتلية')}}
$('runBtn').addEventListener('click',()=>snap('تشغيل'));
$('histBtn').onclick=()=>{const L=(SNAP()[DB.cur]||[]).slice().reverse();modal('<h3>النسخ المحفوظة (آخر 15 تشغيل)</h3>'+(L.length?L.map((s,i)=>`<button class="tpl" data-i="${i}">${new Date(s.t).toLocaleString('ar-EG')}<small>${Object.keys(s.f).length} ملف، ${Object.values(s.f).reduce((a,b)=>a+b.length,0)} حرف</small></button>`).join(''):'<p>اضغط ▶ شغّل علشان تتحفظ نسخة.</p>'));document.querySelectorAll('.tpl').forEach(b=>b.onclick=()=>{const s=L[+b.dataset.i];if(!confirm('استرجاع النسخة دي؟ (الحالية هتتحفظ قبلها)'))return;snap('قبل الاسترجاع');cur.files=JSON.parse(JSON.stringify(s.f));if(!cur.files[file])file=Object.keys(cur.files)[0];save();closeModal();renderTabs();showFile();run();toast('اتسترجع')})};
</script>
</body>
